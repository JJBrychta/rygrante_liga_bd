[project]
name = "spark-lakehouse-starter"
version = "0.1.0"
description = "Starter repository for the CorpTech Enterprise Lakehouse & Medallion Pipeline course project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==3.5.5",
    "delta-spark==3.3.0",
    "duckdb>=1.1.0",
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "plotly>=5.24.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
